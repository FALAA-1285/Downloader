<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Media Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="logo-area">
      <div class="logo-icon"></div>
      <span class="logo-title">Media Downloader</span>
    </div>
    <a href="http://localhost:3000" target="_blank" class="web-link" title="Buka Web UI">Web UI ↗</a>
  </header>

  <main class="main">
    <div class="page-info">
      <div class="tab-title" id="tabTitle">Memuat tab...</div>
      <div class="tab-url" id="tabUrl">—</div>
    </div>

    <div class="actions-row">
      <button id="btnAnalyzePage" class="btn btn-primary">
        Buka di Web UI
      </button>
      <button id="btnCopyCookies" class="btn btn-secondary" title="Salin cookie sesi tab ini">
        Salin Cookie Sesi
      </button>
    </div>

    <div class="section-title">
      <span>Stream Media Terdeteksi</span>
      <span class="badge" id="mediaCount">0</span>
    </div>

    <div id="mediaList" class="media-list">
      <div class="empty-state">
        <p>Belum ada stream terdeteksi.</p>
        <small>Putar video di tab ini untuk memicu lalu lintas media.</small>
      </div>
    </div>
  </main>

  <footer class="footer">
    <span id="statusText">Siap</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
