<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Media Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="logo-area">
      <div class="logo-icon"></div>
      <span class="logo-title">Media Downloader</span>
    </div>
    <a id="webLink" href="#" target="_blank" rel="noopener" class="web-link" title="Buka Web UI">Web UI ↗</a>
  </header>

  <main class="main">
    <div class="page-info">
      <div class="tab-title" id="tabTitle">Memuat tab...</div>
      <div class="tab-url" id="tabUrl">—</div>
    </div>

    <div class="permission-box" id="permissionBox" hidden>
      <p>Penangkapan stream dari lalu lintas jaringan belum diizinkan. Izin bisa dicabut kapan saja.</p>
      <button id="btnGrant" class="btn btn-primary">Izinkan penangkapan jaringan</button>
    </div>

    <div class="actions-row">
      <button id="btnAnalyzePage" class="btn btn-primary">Buka di Web UI</button>
      <button id="btnCopyCookies" class="btn btn-secondary" title="Salin cookie tab ini dalam format cookies.txt">
        Salin cookies.txt
      </button>
    </div>

    <div class="section-title">
      <span>Stream Media Terdeteksi</span>
      <span class="badge" id="mediaCount">0</span>
    </div>

    <div id="mediaList" class="media-list"></div>

    <details class="settings">
      <summary>Pengaturan</summary>
      <label for="uiBase">Alamat Web UI</label>
      <div class="settings-row">
        <input id="uiBase" type="url" spellcheck="false" placeholder="http://localhost:3000">
        <button id="btnSaveBase" class="btn-small">Simpan</button>
      </div>
      <button id="btnRevoke" class="btn-link" hidden>Cabut izin penangkapan jaringan</button>
    </details>
  </main>

  <footer class="footer">
    <span id="statusText">Siap</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
